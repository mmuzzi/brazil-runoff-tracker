name: Update data
on:
  schedule:
    - cron: "23 11 * * *"   # daily, 08:23 Brasília
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-data
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull Plano Político + Polymarket
        run: python3 scripts/update.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/model_history.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: daily update $(date -u +%F)"
          git push

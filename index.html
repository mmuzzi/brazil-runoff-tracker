<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brazil Presidential Election Tracker 2026</title>
<meta name="description" content="Polls, Plano Político's model and Polymarket for Brazil's 2026 presidential runoff.">
<meta property="og:title" content="Brazil Presidential Election Tracker 2026">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%228%22 height=%2216%22 fill=%22%23c8202f%22/%3E%3Crect x=%228%22 width=%228%22 height=%2216%22 fill=%22%231f5fb4%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f6f7f5; --panel:#fcfcfb; --fg:#1b1f1d; --muted:#5f6763; --faint:#8a928e; --rule:#e3e6e3; --hi:#eef1ee;
  --lula:#c8202f; --flavio:#1f5fb4;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121514; --panel:#1a1a19; --fg:#e8ece9; --muted:#9aa49f; --faint:#6f7873; --rule:#2a2f2c; --hi:#222826;
  --lula:#d23a44; --flavio:#4a8af0; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration-color:var(--faint);text-underline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 48px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5vw,44px);line-height:1;margin:0}
h2{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:13px;border:0;background:none;color:var(--muted);padding:5px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed=true]{background:var(--hi);color:var(--fg);font-weight:600}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:16px 16px 10px;position:relative;min-width:0}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.big{display:flex;gap:22px;margin:10px 0 4px;font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:15px;color:var(--muted);font-weight:500;margin-left:2px}
.big .l{color:var(--lula)} .big .f{color:var(--flavio)} .big .n{color:var(--fg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;border-top:2px solid var(--muted)}
.sw.thin{border-top-width:1px}
.sw.dash{border-top-style:dashed}
.sw.ring{width:9px;height:9px;border:1.5px solid var(--muted);border-radius:50%}
.sw.band{height:8px;border:0;background:var(--muted);opacity:.3;border-radius:2px}
svg.chart{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.grid line{stroke:var(--rule)}
.axis text{fill:var(--faint);font-family:var(--f-mono);font-size:10.5px}
.marker line{stroke:var(--faint)}
.marker text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.endlbl{font-family:var(--f-mono);font-size:11px;fill:var(--fg)}
.cross{stroke:var(--muted);pointer-events:none}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 18px rgba(0,0,0,.08);min-width:160px;display:none;z-index:2}
.tip .d{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-bottom:3px}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.tip .pl{color:var(--muted);font-size:11.5px;margin-top:4px;border-top:1px solid var(--rule);padding-top:4px}
.tbl{margin-top:28px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;margin-top:10px;white-space:nowrap}
th{font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--rule)}
td{padding:6px 8px;border-bottom:1px solid var(--rule);text-align:right}
th.t,td.t{text-align:left}
td.reg{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.foot{margin-top:20px;font-size:12px;color:var(--faint)}
.err{color:var(--lula)}
@media (max-width:860px){.charts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Brazil Presidential Election Tracker 2026</h1>
    <span class="seg" data-ctl="range"><button data-v="runoff">Runoff</button><button data-v="all">Since April</button></span>
  </div>

  <div class="charts">
    <div class="card">
      <div class="hd"><h2>Polls</h2><span class="seg" data-ctl="avg"><button data-v="ours">Our average</button><button data-v="pp">Plano Político</button></span></div>
      <div class="big" id="big-polls"></div>
      <div class="legend"><span><span class="sw"></span>2026</span><span><span class="sw dash"></span>2022 Bolsonaro × Lula, same days before runoff</span><span><span class="sw ring"></span>2022 result</span></div>
      <svg class="chart" id="svg-polls" role="img" aria-label="Poll average, two-way vote share"></svg>
      <div class="tip" id="tip-polls"></div>
    </div>
    <div class="card">
      <div class="hd"><h2>Chance of winning</h2></div>
      <div class="big" id="big-prob"></div>
      <div class="legend"><span><span class="sw"></span>Plano Político model</span><span><span class="sw thin"></span>Polymarket</span><span><span class="sw band"></span>Range</span></div>
      <svg class="chart" id="svg-prob" role="img" aria-label="Chance of winning, model and Polymarket"></svg>
      <div class="tip" id="tip-prob"></div>
    </div>
  </div>

  <div class="tbl">
    <h2>Runoff polls</h2>
    <table id="tbl"></table>
  </div>

  <p class="foot" id="foot"></p>
</div>

<script>
(async function(){
const $ = s => document.querySelector(s);
let D;
try {
  const r = await fetch('data/data.json', {cache:'no-cache'});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  D = await r.json();
} catch (e) {
  $('.charts').outerHTML = `<p class="err">Couldn't load data (${e.message}).</p>`;
  return;
}

const state = {range:'runoff', avg:'ours'};
const day = s => Date.parse(s + 'T12:00:00Z');
const fmtD = s => new Date(day(s)).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
const pct = (v,d=1) => v==null ? '–' : v.toFixed(d);
const last = a => a[a.length-1];
const MODE = {Presencial:'In person', Telefone:'Phone', Internet:'Online', Misto:'Mixed'};

// ---- svg helpers
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag); for(const a in attrs) e.setAttribute(a,attrs[a]); if(parent) parent.appendChild(e); return e; }
function segments(pts){
  // split on the first-round regime change and on gaps > 3 days
  const out=[]; let cur=[];
  for (const p of pts){
    if (p.v==null){ if(cur.length) out.push(cur); cur=[]; continue; }
    const prev = cur[cur.length-1];
    if (prev && (p.brk || day(p.d)-day(prev.d) > 3*864e5)){ out.push(cur); cur=[]; }
    cur.push(p);
  }
  if (cur.length) out.push(cur);
  return out;
}
const linePath = (pts,x,y) => segments(pts).map(s=>s.map((p,i)=>(i?'L':'M')+x(day(p.d)).toFixed(1)+','+y(p.v).toFixed(1)).join('')).join('');

let W = 560, H = 330; const M = {t:14, r:112, b:26, l:34};
function size(svg){ W = Math.max(300, Math.round(svg.parentElement.clientWidth - 32)); H = Math.round(Math.min(340, Math.max(240, W*0.6))); }
function xDomain(){
  const today = day(new Date().toISOString().slice(0,10));
  const x1 = Math.max(day(D.runoff), today) + 864e5*0.5;
  const x0 = state.range==='runoff' ? day(D.round1) - 864e5*0.5 : day(D.start);
  return [x0, x1];
}
function frame(svg, y0, y1, yticks){
  svg.innerHTML=''; svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const [x0,x1] = xDomain();
  const x = t => M.l + (t-x0)/(x1-x0)*(W-M.l-M.r);
  const y = v => M.t + (1-(v-y0)/(y1-y0))*(H-M.t-M.b);
  const g = el('g',{class:'grid'},svg), ax = el('g',{class:'axis'},svg);
  for (const v of yticks){ el('line',{x1:M.l,x2:W-M.r,y1:y(v),y2:y(v)},g); el('text',{x:M.l-6,y:y(v)+3.5,'text-anchor':'end'},ax).textContent=v+'%'; }
  const span = (x1-x0)/864e5, ticks=[];
  if (span < 40){ for(let t=x0+864e5*0.5; t<=x1; t+=864e5) if(new Date(t).getUTCDay()===1) ticks.push(t); }
  else { const d=new Date(x0); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+1); for(;d.getTime()<=x1;d.setUTCMonth(d.getUTCMonth()+1)) ticks.push(d.getTime()); }
  for (const t of ticks) el('text',{x:x(t),y:H-8,'text-anchor':'middle'},ax).textContent = new Date(t).toLocaleDateString('en-US', span<40?{month:'short',day:'numeric',timeZone:'UTC'}:{month:'short',timeZone:'UTC'});
  el('line',{x1:M.l,x2:W-M.r,y1:H-M.b,y2:H-M.b,stroke:'var(--rule)'},svg);
  // first round + runoff markers
  const mk = el('g',{class:'marker'},svg), r1 = day(D.round1), ro = day(D.runoff), wide = span > 60;
  if (r1 >= x0){ el('line',{x1:x(r1),x2:x(r1),y1:M.t,y2:H-M.b},mk); el('text',{x:x(r1)+(wide?-4:4),y:M.t+10,'text-anchor':wide?'end':'start'},mk).textContent='1st round'; }
  el('line',{x1:x(ro),x2:x(ro),y1:M.t,y2:H-M.b},mk);
  el('text',{x:x(ro)+(wide?4:-4),y:wide?H-M.b-6:M.t+10,'text-anchor':wide?'start':'end'},mk).textContent='Runoff';
  el('line',{x1:M.l,x2:W-M.r,y1:y(50),y2:y(50),stroke:'var(--faint)'},svg);
  return {x,y};
}
function endLabels(svg, items, y){
  items = items.filter(i=>i.v!=null).map(i=>({...i, yy:y(i.v)})).sort((a,b)=>a.yy-b.yy);
  for (let i=1;i<items.length;i++) if (items[i].yy - items[i-1].yy < 13) items[i].yy = items[i-1].yy + 13;
  for (const i of items) el('text',{class:'endlbl',x:W-M.r+6,y:i.yy+4,...(i.muted?{fill:'var(--muted)','font-size':10}:{})},svg).textContent = i.text;
}

// ---- hover: one date shared by both charts
const charts = {};
const hover = ms => { for (const id in charts) charts[id](ms); };
function attachHover(id, svg, sc, tip, rowsFor){
  const cross = el('line',{class:'cross',y1:M.t,y2:H-M.b,visibility:'hidden'},svg);
  const dots = el('g',{},svg);
  const hit = el('rect',{x:M.l,y:0,width:W-M.l-M.r,height:H,fill:'transparent'},svg);
  const toDate = evt => {
    const t = evt.touches ? evt.touches[0] : evt, pt = svg.createSVGPoint();
    pt.x=t.clientX; pt.y=t.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const [x0,x1]=xDomain(); const ms = x0 + (p.x-M.l)/(W-M.l-M.r)*(x1-x0);
    return Math.round((ms-day('2026-01-01'))/864e5)*864e5 + day('2026-01-01');
  };
  hit.addEventListener('mousemove', e=>hover(toDate(e)));
  hit.addEventListener('touchmove', e=>hover(toDate(e)), {passive:true});
  hit.addEventListener('mouseleave', ()=>hover(null));
  charts[id] = ms => {
    dots.innerHTML='';
    const hide = () => { cross.setAttribute('visibility','hidden'); tip.style.display='none'; };
    const [x0,x1]=xDomain();
    if (ms==null || ms<x0 || ms>x1) return hide();
    const d = new Date(ms).toISOString().slice(0,10), {rows, extra=''} = rowsFor(d);
    if (!rows.length) return hide();
    const X = sc.x(ms);
    cross.setAttribute('x1',X); cross.setAttribute('x2',X); cross.setAttribute('visibility','visible');
    for (const r of rows) if (r.dot!=null) el('circle',{cx:X,cy:sc.y(r.dot),r:4,fill:r.c,stroke:'var(--panel)','stroke-width':2},dots);
    tip.innerHTML = `<div class="d">${fmtD(d)}</div>` + rows.map(r=>`<div class="r"><span style="color:${r.c}">${r.k}</span><b>${r.v}</b></div>`).join('') + extra;
    tip.style.display='block';
    const box = svg.getBoundingClientRect(), card = svg.parentElement.getBoundingClientRect();
    const px = box.left - card.left + X/W*box.width, tw = tip.offsetWidth;
    tip.style.left = (px + 14 + tw > card.width ? px - 14 - tw : px + 14) + 'px';
    tip.style.top = (box.top - card.top + 20) + 'px';
  };
}

// ---- polls
function drawPolls(){
  const svg = $('#svg-polls'); size(svg);
  const [x0,x1] = xDomain();
  const polls = D.polls.filter(p => day(p.end) >= x0 && day(p.end) <= x1);
  const y22 = D.y2022.avg.filter(r=>day(r.d)>=x0 && day(r.d)<=x1);
  const ext = polls.flatMap(p=>[p.two_way, 100-p.two_way]).concat(y22.flatMap(r=>[r.bolsonaro, r.lula]));
  const y0 = Math.floor(Math.min(46,...ext)/2)*2, y1 = Math.ceil(Math.max(54,...ext)/2)*2;
  const ticks=[]; for(let v=y0; v<=y1; v+=(y1-y0>16?4:2)) ticks.push(v);
  const {x,y} = frame(svg, y0, y1, ticks);
  const g = el('g',{},svg);
  for (const p of polls){
    el('circle',{cx:x(day(p.end)),cy:y(p.two_way),r:3,fill:'var(--flavio)','fill-opacity':.35},g);
    el('circle',{cx:x(day(p.end)),cy:y(100-p.two_way),r:3,fill:'var(--lula)','fill-opacity':.35},g);
  }
  // 2022 runoff, shifted so its runoff day lands on this one
  for (const [c,k] of [['flavio','bolsonaro'],['lula','lula']]){
    el('path',{d:linePath(y22.map(r=>({d:r.d,v:r[k]})),x,y),fill:'none',stroke:`var(--${c})`,'stroke-width':1.5,'stroke-dasharray':'5 4','stroke-opacity':.7},svg);
    el('circle',{cx:x(day(D.runoff)),cy:y(D.y2022.result[k]),r:4.5,fill:'var(--panel)',stroke:`var(--${c})`,'stroke-width':1.75},svg);
  }
  const avg = (state.avg==='pp' ? D.avg_pp : D.avg_ours).filter(r=>day(r.d)>=x0);
  for (const c of ['flavio','lula'])
    el('path',{d:linePath(avg.map((r,i)=>({d:r.d,v:r[c],brk:i>0&&avg[i-1].phase!==r.phase})),x,y),fill:'none',stroke:`var(--${c})`,'stroke-width':2.25,'stroke-linejoin':'round'},svg);
  const a = last(avg);
  const R = D.y2022.result;
  endLabels(svg, [{v:a.flavio,text:`Flávio ${pct(a.flavio)}`},{v:a.lula,text:`Lula ${pct(a.lula)}`},
    {v:R.bolsonaro,text:`2022 Bolso. ${pct(R.bolsonaro)}`,muted:1},{v:R.lula,text:`2022 Lula ${pct(R.lula)}`,muted:1}], y);
  $('#big-polls').innerHTML = `<span class="f">Flávio <span class="n">${pct(a.flavio)}<small>%</small></span></span><span class="l">Lula <span class="n">${pct(a.lula)}<small>%</small></span></span>`;
  attachHover('polls', svg, {x,y}, $('#tip-polls'), d=>{
    const r = (state.avg==='pp' ? D.avg_pp : D.avg_ours).find(r=>r.d===d);
    const rows = r ? [{k:'Flávio',v:pct(r.flavio),c:'var(--flavio)',dot:r.flavio},{k:'Lula',v:pct(r.lula),c:'var(--lula)',dot:r.lula}] : [];
    const ended = D.polls.filter(p=>p.end===d), o = D.y2022.avg.find(r=>r.d===d);
    const old = o ? `<div class="pl">2022 (${fmtD(o.d22)}): Bolsonaro ${pct(o.bolsonaro)} · Lula ${pct(o.lula)}${d===D.runoff?`<br>2022 result: Bolsonaro ${pct(D.y2022.result.bolsonaro)} · Lula ${pct(D.y2022.result.lula)}`:''}</div>` : '';
    if (!rows.length && o) rows.push({k:'2022 Bolsonaro',v:pct(o.bolsonaro),c:'var(--flavio)',dot:o.bolsonaro},{k:'2022 Lula',v:pct(o.lula),c:'var(--lula)',dot:o.lula});
    return {rows, extra: old + (ended.length ? `<div class="pl">${ended.map(p=>`${p.pollster}: Flávio ${pct(p.two_way)}`).join('<br>')}</div>` : '')};
  });
}

// ---- chance of winning: both candidates, model vs market, shaded range between
function drawProb(){
  const svg = $('#svg-prob'); size(svg);
  const [x0] = xDomain();
  const {x,y} = frame(svg, 0, 100, [0,25,50,75,100]);
  const mkt = new Map(D.market.map(r=>[r.d,r]));
  const mod = D.model.filter(r=>day(r.d)>=x0);
  const brk = (r,i,a) => i>0 && a[i-1].d<=D.round1 && r.d>D.round1;
  for (const c of ['flavio','lula']){
    const col = `var(--${c})`;
    const both = mod.map((r,i,a)=>({d:r.d, v:r[c], b:mkt.get(r.d)?.[c], brk:brk(r,i,a)})).filter(p=>p.v!=null && p.b!=null);
    for (const s of segments(both)){
      const top = s.map((p,i)=>(i?'L':'M')+x(day(p.d)).toFixed(1)+','+y(p.v).toFixed(1)).join('');
      const bot = [...s].reverse().map(p=>'L'+x(day(p.d)).toFixed(1)+','+y(p.b).toFixed(1)).join('');
      el('path',{d:top+bot+'Z',fill:col,'fill-opacity':.16,stroke:'none'},svg);
    }
    const mk = D.market.filter(r=>day(r.d)>=x0).map(r=>({d:r.d,v:r[c]}));
    el('path',{d:linePath(mk,x,y),fill:'none',stroke:col,'stroke-width':1,'stroke-opacity':.85,'stroke-linejoin':'round'},svg);
    el('path',{d:linePath(mod.map((r,i,a)=>({d:r.d,v:r[c],brk:brk(r,i,a)})),x,y),fill:'none',stroke:col,'stroke-width':2.25,'stroke-linejoin':'round'},svg);
  }
  const m = last(D.model), k = last(D.market);
  const rng = c => { const a=Math.round(m[c]), b=Math.round(k[c]); return a===b ? `${a}` : `${Math.min(a,b)}–${Math.max(a,b)}`; };
  endLabels(svg, [{v:(m.flavio+k.flavio)/2,text:`Flávio ${rng('flavio')}%`},{v:(m.lula+k.lula)/2,text:`Lula ${rng('lula')}%`}], y);
  $('#big-prob').innerHTML = `<span class="f">Flávio <span class="n">${rng('flavio')}<small>%</small></span></span><span class="l">Lula <span class="n">${rng('lula')}<small>%</small></span></span>`;
  attachHover('prob', svg, {x,y}, $('#tip-prob'), d=>{
    const a = D.model.find(r=>r.d===d), b = mkt.get(d), rows=[];
    for (const [c,n] of [['flavio','Flávio'],['lula','Lula']]){
      if (a?.[c]!=null) rows.push({k:`${n} · model`,v:pct(a[c],0)+'%',c:`var(--${c})`,dot:a[c]});
      if (b?.[c]!=null) rows.push({k:`${n} · Polymarket`,v:pct(b[c],0)+'%',c:`var(--${c})`,dot:b[c]});
    }
    return {rows};
  });
}

// ---- table
const field = p => {
  if (!p.start || p.start===p.end) return fmtD(p.end);
  const a = fmtD(p.start), b = fmtD(p.end);
  return a.split(' ')[0]===b.split(' ')[0] ? `${a}–${b.split(' ')[1]}` : `${a}–${b}`;
};
const runoff = D.polls.filter(p=>p.phase==='runoff').reverse();
$('#tbl').innerHTML = `<thead><tr><th class="t">Fieldwork</th><th class="t">Pollster</th><th>Sample</th><th class="t">Mode</th><th>Lula</th><th>Flávio</th><th>Undecided</th><th>Flávio two-way</th><th class="t">TSE reg.</th></tr></thead><tbody>` +
  runoff.map(p=>`<tr><td class="t">${field(p)}</td><td class="t">${p.url?`<a href="${p.url}" target="_blank" rel="noopener">${p.pollster}</a>`:p.pollster}</td><td>${p.n?p.n.toLocaleString('en-US'):'–'}</td><td class="t">${MODE[p.mode]||p.mode||'–'}</td><td>${pct(p.lula)}</td><td>${pct(p.flavio)}</td><td>${pct(Math.max(0,100-p.lula-p.flavio))}</td><td>${pct(p.two_way)}</td><td class="t reg">${p.reg||'–'}</td></tr>`).join('') + '</tbody>';
$('#foot').innerHTML = `Polls &amp; model: <a href="https://planopolitico.com.br/agregador/">Plano Político</a> · Market: <a href="https://polymarket.com/event/brazil-presidential-election">Polymarket</a> · Updated ${new Date(D.updated_at).toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'})}`;

// ---- controls
function render(){
  document.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String(state[s.dataset.ctl]===b.dataset.v))));
  drawPolls(); drawProb();
}
document.querySelectorAll('.seg').forEach(s=>s.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b){ state[s.dataset.ctl]=b.dataset.v; render(); } }));
let rz; addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(render,120); });
render();
})();
</script>
</body>
</html>
